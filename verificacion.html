<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación CAPTCHA</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <h2>Por favor, verifica que no eres un robot</h2>

  <form id="captcha-form" action="https://regalamonedas.net" method="GET">
    <div class="g-recaptcha" data-sitekey="6Lf-8ygrAAAAAJNYqyOQu3Qw9R-s4dOWFrktneqd" data-callback="captchaCompletado"></div>
  </form>

  <script>
    function captchaCompletado() {
      document.getElementById("captcha-form").submit();
    }
  </script>
</body>
</html>
